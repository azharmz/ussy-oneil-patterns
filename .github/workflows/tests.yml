name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_p8_development:
        description: "Run canonical P8 DEVELOPMENT labels"
        required: false
        default: true
        type: boolean
      run_p6_development:
        description: "Run authoritative P6 DEVELOPMENT labels"
        required: false
        default: false
        type: boolean

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  p8-development:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_p8_development) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[p8-run]')) }}
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[validation]"
      - run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            python scripts/run_p8_development.py --validation --example-id p8-label-0002
          else
            python scripts/run_p8_development.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p8-canonical-development
          path: results/p8-canonical-development.json
          if-no-files-found: warn

  p6-development:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_p6_development) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[p6-run]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[validation]"
      - run: python scripts/run_p6_development.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-authoritative-development
          path: results/p6-authoritative-development.json
          if-no-files-found: warn

  cwh-research:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cwh-research]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download immutable R2 history
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import boto3
          from botocore.config import Config
          required = ["R2_ENDPOINT", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY", "R2_BUCKET_NAME"]
          missing = [x for x in required if not os.environ.get(x)]
          if missing:
              raise SystemExit("Missing required R2 secrets: " + ", ".join(missing))
          s3 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto", config=Config(retries={"max_attempts": 5, "mode": "adaptive"}))
          bucket = os.environ["R2_BUCKET_NAME"]
          out = Path("history/ohlcv"); out.mkdir(parents=True, exist_ok=True)
          keys = []
          paginator = s3.get_paginator("list_objects_v2")
          for page in paginator.paginate(Bucket=bucket, Prefix="history/ohlcv/"):
              for item in page.get("Contents", []):
                  key = item["Key"]
                  if key.endswith(".parquet"):
                      keys.append(key)
          if not keys:
              raise SystemExit("No parquet objects found under R2 prefix history/ohlcv/")
          for i, key in enumerate(sorted(keys), 1):
              target = out / Path(key).name
              s3.download_file(bucket, key, str(target))
              if i % 100 == 0:
                  print(f"downloaded {i}/{len(keys)}")
          print(f"R2 history files: {len(keys)}")
          PY
      - name: Run frozen c433cc1 scan
        run: |
          git worktree add ../engine-c433 c433cc1e35a5aa32a46f732cd8c5545935e36e40
          mkdir -p ../engine-c433/scripts
          cp scripts/research_cwh_scan.py scripts/analyze_cwh_scan.py ../engine-c433/scripts/
          python -m pip install -e ../engine-c433
          (cd ../engine-c433 && python scripts/research_cwh_scan.py --history-dir "$GITHUB_WORKSPACE/history/ohlcv" --window-years 3 --out-dir "$GITHUB_WORKSPACE/results/cwh-3y-c433cc1" --workers 4)
          python scripts/analyze_cwh_scan.py results/cwh-3y-c433cc1/research-cwh-3y.json --out results/cwh-3y-c433cc1
      - name: Run HEAD scan
        run: |
          python -m pip install -e .
          python scripts/research_cwh_scan.py --history-dir history/ohlcv --window-years 3 --out-dir results/cwh-3y-head --workers 4
          python scripts/analyze_cwh_scan.py results/cwh-3y-head/research-cwh-3y.json --out results/cwh-3y-head
      - name: Compare engine versions and summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path("results")
          old = json.loads((root/"cwh-3y-c433cc1/research-cwh-3y.json").read_text())
          new = json.loads((root/"cwh-3y-head/research-cwh-3y.json").read_text())
          ids_old = {x["assessment_id"] for x in old["results"]}
          ids_new = {x["assessment_id"] for x in new["results"]}
          def load_summary(path):
              return (root/path/"summary.txt").read_text()
          lines = [
              "CWH RESEARCH — c433cc1 vs HEAD",
              "",
              f"c433 engine_sha: {old.get('engine_sha')}",
              f"HEAD engine_sha: {new.get('engine_sha')}",
              f"history_files c433 / HEAD: {old.get('history_files')} / {new.get('history_files')}",
              f"errors c433 / HEAD: {len(old.get('errors', []))} / {len(new.get('errors', []))}",
              f"assessments c433 / HEAD: {len(ids_old)} / {len(ids_new)}",
              f"assessment_id only c433 / only HEAD: {len(ids_old-ids_new)} / {len(ids_new-ids_old)}",
              f"shared assessment_id: {len(ids_old & ids_new)}",
              "",
              "BASELINE SCAN COMPARISON",
              "Historical artifact from run 36122641409 was not available through GitHub artifact API at execution time;",
              "therefore exact ID comparison to the original 99,995-assessment artifact could not be verified.",
              "Known historical baseline count: 99,995. Count matches c433: " + str(len(ids_old) == 99995),
              "",
              "=== c433cc1 metrics ===",
              load_summary("cwh-3y-c433cc1"),
              "",
              "=== HEAD metrics ===",
              load_summary("cwh-3y-head"),
          ]
          text = "\n".join(lines) + "\n"
          Path("summary.txt").write_text(text)
          print(text)
          for label, payload in [("c433cc1", old), ("HEAD", new)]:
              mismatch = sum(x.get("price_check") != "OK" for x in payload["results"])
              if mismatch:
                  raise SystemExit(f"STOP: {label} price_check MISMATCH={mismatch}")
              if payload.get("errors"):
                  raise SystemExit(f"STOP: {label} has {len(payload['errors'])} per-file errors")
          if len(ids_old) != 99995:
              raise SystemExit(f"STOP: c433cc1 count {len(ids_old)} != historical 99995")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cwh-precision-summary
          path: summary.txt
          if-no-files-found: warn
